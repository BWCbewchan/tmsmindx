        <text x="742" y="29" font-size="11" font-weight="600" fill="#047857">Đạt tiêu chuẩn</text>

        <rect x="880" y="12" width="95" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
        <text x="895" y="28" font-size="11" font-weight="600" fill="#334155">Chi tiết ➔</text>
